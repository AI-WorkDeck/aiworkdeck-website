# 上游不在时的兜底页（server 块内 include）。
# ---------------------------------------------------------------------------
# 没有它，用户在 pm2 重启的那几秒里看到的是 nginx 默认的白底 "502 Bad Gateway"。
#
# **这是兜底，不是维护开关**：没有任何标志位需要人去设、去清，因此也就不存在
# 「部署挂在半路、站点永远停在维护页」这种状态。上游一活过来就自动恢复，
# 顺带也接住了进程真的崩掉的情况。
#
# 构建期间已经用不到它了——scripts/deploy-build-swap.sh 把构建挪到暂存目录，
# 线上产物在换入前一个字节没动。这里覆盖的只剩重启那几秒。
#
# 装法见 DEPLOY.md §10。两个静态文件在 deploy/nginx/，装到 /www/wwwroot/awd-maintenance/。
#
# 两条实现约束（都是踩出来的）：
# - `if` 里只用 `rewrite ... break`。`default_type` 在 `if` 里直接 nginx -t 报
#   "directive is not allowed here"，所以 JSON 不是 `return` 出来的，而是让 nginx
#   去发一个真的 .json 文件——Content-Type 由 mime.types 给，不需要 default_type。
# - recursive_error_pages 默认 off，所以这里发出去的 503 不会再被 error_page
#   接一次，不存在递归。
# ---------------------------------------------------------------------------

# `=503` 不是可有可无的。写成 `= @awd_unavailable`（不带状态码）时，响应状态会变成
# 命名 location 里那个静态文件的 **200**——实测踩到。200 的后果是实打实的：
# 官网表单侧 `res.ok` 会是 true，登录表单会把这张兜底页当成登录成功、直接跳转；
# 搜索引擎也会把它当正文收录。必须显式回 503（临时不可用的正确语义，配 Retry-After）。
error_page 502 503 504 =503 @awd_unavailable;

location @awd_unavailable {
    root /www/wwwroot/awd-maintenance;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 15 always;

    # 接口回 JSON 而不是一页 HTML：官网表单侧 lib/api-result.ts 两条判据都接得住，
    # 但桌面端与插件也在打这些端点，给它们一个可解析的错误体更干净。
    if ($uri ~ ^/api/) {
        rewrite ^ /503.json break;
    }
    rewrite ^ /503.html break;
}
