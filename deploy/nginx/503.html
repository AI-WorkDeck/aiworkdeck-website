<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务正在更新 — AI WorkDeck</title>
<style>
  :root { --ink: #2B2A26; --forest: #2E5A50; --pale: #F1EFE7; --line: #DDD8CA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--pale); color: var(--ink);
    font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; width: 100%; background: #FCFBF7; border: 1px solid var(--line);
         border-radius: 16px; padding: 48px 40px; }
  .mark { font-size: .8125rem; letter-spacing: .08em; text-transform: uppercase;
          color: var(--forest); margin: 0 0 24px; }
  h1 { font-size: 1.625rem; line-height: 1.4; margin: 0 0 16px; font-weight: 600; color: var(--forest); }
  p { font-size: 1rem; line-height: 1.8; margin: 0 0 12px; }
  .en { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .en h2 { font-size: 1.125rem; margin: 0 0 10px; font-weight: 600; color: var(--forest); }
  .en p { font-size: .9375rem; color: #6B675C; }
  @media (max-width: 480px) { main { padding: 32px 24px; } h1 { font-size: 1.375rem; } }
</style>
</head>
<body>
<main>
  <p class="mark">AI WorkDeck</p>
  <h1>服务正在更新</h1>
  <p>我们正在发布新版本，通常一两分钟内恢复。请稍后重试。</p>
  <p>这期间你的账户与数据不受影响。</p>
  <div class="en">
    <h2>The service is updating</h2>
    <p>We are shipping a new version. This usually takes a minute or two — please try again shortly. Your account and data are unaffected.</p>
  </div>
</main>
</body>
</html>
