# Enterprise retired at the owner’s request (dev-board#1705, 2026-11-04).
# No proxy, redirect, or data deletion. Keep ordinary website routes unchanged.
location = /enterprise { return 410; }
location ^~ /enterprise/ { return 410; }
location ~ ^/(zh|zh-hant|en|ja|ko|th|ms|id|vi|fr|de|es|pt|it|ru|el|tr|nl|hi|ar)/enterprise(?:/|$) {
    return 410;
}
