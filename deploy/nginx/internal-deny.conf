# 内部记账口的公网兜底：`/api/internal/` 整个前缀一律 404。
# ---------------------------------------------------------------------------
# **这是国内站（www.aiworkdeck.com）这条规则的仓库源本**。国内站的 vhost 在宝塔面板里
# （`/www/server/panel/vhost/nginx/www.aiworkdeck.com.conf`），不在本仓库，所以规则本身
# 存在这里；国际站的 vhost 源本在仓库里，那条规则**直接写在** `doc/nginx-workdeck-ai.conf`
# 的 `^~ /api/` 上面一段。两处必须同时存在，装法与核对命令见 DEPLOY.md §7.5。
#
# 挡的是什么：`app/api/internal/transfer`（dev-board#251）与 `app/api/internal/account`
# （dev-board#425）。这两条路由的鉴权是共享密钥（`X-Internal-Secret`），**不是** Bearer awdk_，
# 调用方只有同机部署的 Java 云后端，走 `127.0.0.1:<next端口>` 直连，从不经过公网。
#
# 为什么代码侧不判 IP：Next 在反代后面拿到的 remote addr 恒是 nginx 自己，判它等于没判。
# 真正的边界就是这条 404 + 共享密钥两层，缺一层都不行——account 那条口子能按手机号
# 建号、能按 accountId 建收款单，能力面比 transfer 大。
#
# `^~` 前缀匹配优先级高于正则 location，也高于 `location /`；`/api/internal/` 比
# `/api/` 长，nginx 取最长匹配的前缀，所以放在 server 块里的哪个位置都生效。
# 回 404 而不是 403：403 等于告诉探测者「这里有东西，只是你进不去」。
# ---------------------------------------------------------------------------

location ^~ /api/internal/ { return 404; }
