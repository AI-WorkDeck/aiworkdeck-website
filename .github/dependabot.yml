version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /web-workbench
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, security]
    commit-message:
      prefix: deps
