name: Security gate
on:
  pull_request:
  push:
    branches: [master, 'codex/release-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Semgrep security rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'
      - name: Install pinned local scanners
        run: python -m pip install semgrep==1.183.0 PyYAML==6.0.3
      - name: Fetch exact community rule revision
        run: |
          git init "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" remote add origin https://github.com/semgrep/semgrep-rules.git
          git -C "$RUNNER_TEMP/semgrep-rules" fetch --depth 1 origin 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          git -C "$RUNNER_TEMP/semgrep-rules" checkout --detach FETCH_HEAD
      - name: Scan repository (no cloud account or source upload)
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: python scripts/security-static.py "$RUNNER_TEMP/semgrep-rules"
      - name: Static gate negative controls
        run: python scripts/verify-security-gates.py "$RUNNER_TEMP/semgrep-rules" --static-only
  secrets:
    name: Gitleaks history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched Git history with fully redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --exit-code=1'
      - name: Scan current candidate source with exact synthetic-fixture checks
        run: PATH="$RUNNER_TEMP:$PATH" python3 scripts/security-secrets.py
      - name: Secret gate negative control
        run: PATH="$RUNNER_TEMP:$PATH" python3 scripts/verify-security-gates.py unused --secrets-only
  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: node scripts/check-dependency-security.mjs
      - run: npx tsx scripts/verify-dependency-security.mts
      - name: Authentication-tag regression
        run: |
          repo="$PWD"
          isolated="$(mktemp -d)"
          cd "$isolated"
          "$repo/node_modules/.bin/tsx" --tsconfig "$repo/tsconfig.json" "$repo/scripts/verify-security-crypto.mts"
