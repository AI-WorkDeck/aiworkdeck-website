name: Build reviewed Next artifacts (no deployment)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed application commit (40 lowercase hex)
        required: true
        type: string
      web_run_id:
        description: Completed CI run with successful same-source Web build job
        required: true
        type: string
      cn_public_config:
        description: Public config JSON (seven-key whitelist, preserve missing defaults) for CN (no secrets)
        required: true
        type: string
      intl_public_config:
        description: Public config JSON (seven-key whitelist, preserve missing defaults) for Intl (no secrets)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        site: [cn, intl]
    steps:
      - name: Checkout reviewed artifact tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ops
          persist-credentials: false
      - name: Validate explicit application source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WEB_RUN_ID: ${{ inputs.web_run_id }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}",os.environ["SOURCE_SHA"]); assert re.fullmatch(r"[1-9][0-9]*",os.environ["WEB_RUN_ID"])'
      - name: Checkout exact application (independent of workflow commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Artifact guard tests
        run: python3 -B ops/scripts/next-ci-artifact.test.py -v
      - name: Build, isolate runtime smoke, and verify archive
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_CONFIG_JSON: ${{ matrix.site == 'cn' && inputs.cn_public_config || inputs.intl_public_config }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WEB_RUN_ID: ${{ inputs.web_run_id }}
          SITE: ${{ matrix.site }}
        run: |
          python3 ops/scripts/next-ci-artifact.py build --app "$GITHUB_WORKSPACE/app" --source-sha "$SOURCE_SHA" --site "$SITE" --web-run-id "$WEB_RUN_ID" --out "$RUNNER_TEMP/next-$SITE"
      - name: Upload verified Next bundle only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-${{ matrix.site }}-${{ inputs.source_sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/next-${{ matrix.site }}/next-artifact.tar.gz
            ${{ runner.temp }}/next-${{ matrix.site }}/next-artifact.sha256
            ${{ runner.temp }}/next-${{ matrix.site }}/provenance.json
            ${{ runner.temp }}/next-${{ matrix.site }}/smoke.json
