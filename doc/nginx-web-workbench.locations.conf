# CN www.aiworkdeck.com server{} include ONLY. Do not wrap in another server{}.
# Use the reviewed vhost include path; this file does not install itself.
# Exact /web is required: otherwise nginx's automatic slash redirect conflicts
# with Next's /web/ -> /web canonical redirect.
location = /web {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding $http_accept_encoding;

    proxy_cache off;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_redirect off;
    gzip off;

    # Keep Next's path-specific policy and precompressed br metadata as returned.
    # No add_header, MIME override, URI rewrite, static alias or decompression.
    proxy_pass_header Cross-Origin-Opener-Policy;
    proxy_pass_header Cross-Origin-Embedder-Policy;
    proxy_pass_header Cross-Origin-Resource-Policy;
    proxy_pass_header Content-Security-Policy;
    proxy_pass_header Content-Encoding;
    proxy_pass_header Content-Type;
    proxy_pass_header Cache-Control;
}

# Bypass the vhost's generic js/css regex without changing any other path.
location ^~ /web/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding $http_accept_encoding;

    proxy_cache off;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_redirect off;
    gzip off;

    # Keep Next's path-specific policy and precompressed br metadata as returned.
    # No add_header, MIME override, URI rewrite, static alias or decompression.
    proxy_pass_header Cross-Origin-Opener-Policy;
    proxy_pass_header Cross-Origin-Embedder-Policy;
    proxy_pass_header Cross-Origin-Resource-Policy;
    proxy_pass_header Content-Security-Policy;
    proxy_pass_header Content-Encoding;
    proxy_pass_header Content-Type;
    proxy_pass_header Cache-Control;
}
