# workdeck.ai —— 国际站（独立应用，不再是国内站的镜像）
#
# 2026-08-08 形态变更：本机从「www.aiworkdeck.com 的反代镜像」改成承载一个**独立的
# Next 应用**（PM2 进程 workdeck-intl，127.0.0.1:3000），有自己的 data/、自己的账户体系、
# 美元计价、Stripe 收款、香港缔约主体。
#
# 源本在官网仓 doc/nginx-workdeck-ai.conf，**服务器上改了要同步回仓库**。
#
# aiworkdeck.us（美国公司名下的域名，dev-board#569）**不是另一个站**：同一个 workdeck-intl
# 进程、同一份数据、同一套账户，只是页脚与公司页按 Host 展示美国主体，并把美国 IP 的
# 访客从 workdeck.ai 引过去。它的 vhost `aiworkdeck.us.conf` 是本文件的**派生物**，不手写：
#
#   sed -n '/^server {/,$p' doc/nginx-workdeck-ai.conf \
#     | sed -e 's/server_name workdeck.ai www.workdeck.ai;/server_name aiworkdeck.us www.aiworkdeck.us;/' \
#           -e 's#/live/workdeck.ai/#/live/aiworkdeck.us/#' \
#           -e 's#/www/wwwlogs/workdeck.ai.log#/www/wwwlogs/aiworkdeck.us.log#' \
#     > /www/server/panel/vhost/nginx/aiworkdeck.us.conf
#
# 第一条 sed 把 http 层的 geo/map 去掉（变量全局可见，重复定义会报错），其余三条只换
# 域名、证书、日志。改了本文件的 server 块，**必须重新生成那份**，见 DEPLOY.md §9.8。
# 设计文档：桌面仓 docs/superpowers/specs/2026-08-08-dual-site-architecture.md

geo $awd_from_cn {
    default 0;
    include /www/server/nginx/conf/china_ip.conf;
}

# 逃生门：用户点过「继续访问国际站」后带上这个 cookie，此后不再被 301 走。
# 没有它，一个注册在国际站、人在境内的用户永远回不了自己的账户页。
map $http_cookie $awd_forced_intl {
    default 0;
    "~*(^|;\s*)awd_site=intl(;|$)" 1;
}
# 跨站链接带的 ?site=intl。cookie 要第二次访问才有，**第一跳只能靠这个参数**——
# 没有它，境内用户从国内站点「去国际站」会被原地 301 弹回来，链接变成死循环。
# 放行后由 Next 中间件把它固化成 cookie，并把参数从地址栏抹掉。
map $arg_site $awd_site_arg_intl {
    default 0;
    "intl"  1;
}

map "$awd_from_cn$awd_forced_intl$awd_site_arg_intl" $awd_redirect_to_cn {
    default 0;
    "100" 1;   # 境内 且 无 cookie 且 无 ?site=intl
}

# ------------------------------------------------------------------
# 美国访客 → aiworkdeck.us（dev-board#569）。清单由 gen-us-ip.py 每月生成（ipdeny 按国家聚合，
# 来源是五家 RIR 的登记记录），与 china_ip 同一套健全性校验。
#
# `proxy 127.0.0.1`：本机 curl 带 X-Forwarded-For 就能冒充美国访客做核对
# （维护者在境内，没有真的美国出口）。只信本机，公网请求的 XFF 一律不看。
#
# 搜索引擎与社交预览爬虫**豁免**：Googlebot 几乎全从美国出口抓取，不豁免的话
# workdeck.ai 在 Google 里会整体被 aiworkdeck.us 顶替，而 .us 页面的 canonical /
# sitemap / hreflang 全指向 workdeck.ai——两边打架，收录归零。
# .us 对搜索引擎的定位就是国际站的别名，不是第二个站。
# ------------------------------------------------------------------
geo $awd_from_us {
    default 0;
    proxy 127.0.0.1;
    include /www/server/nginx/conf/us_ip.conf;
}
map $http_user_agent $awd_is_crawler {
    default 0;
    "~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex|applebot|petalbot|bytespider|gptbot|chatgpt-user|oai-searchbot|claudebot|claude-web|anthropic-ai|perplexitybot|ccbot|ahrefsbot|semrushbot|mj12bot|dotbot|facebookexternalhit|twitterbot|linkedinbot|slackbot|discordbot|telegrambot|whatsapp)" 1;
}
# 只对 workdeck.ai 这个 Host 生效：aiworkdeck.us.conf 是本文件派生的，同一段 location 在
# 那边也会执行，靠 Host 判断避免 .us 自己 301 自己。
map "$awd_from_us$awd_is_crawler$host" $awd_redirect_to_us {
    default 0;
    "~^10(www\.)?workdeck\.ai$" 1;   # 美国 IP 且 非爬虫 且 Host 是 workdeck.ai
}

server {
    listen 80;
    server_name workdeck.ai www.workdeck.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-aiworkdeck;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name workdeck.ai www.workdeck.ai;
    ssl_certificate        /etc/letsencrypt/live/workdeck.ai/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/workdeck.ai/privkey.pem;

    client_max_body_size 100m;

    # 上游不在时的兜底页（pm2 重启那几秒，或进程真的挂了）。
    # 源本是本仓 deploy/nginx/unavailable.conf，装到服务器上的这个路径；
    # 国内站走宝塔的 extension 目录，装的是同一份。装法见 DEPLOY.md §10。
    include /www/server/nginx/conf/awd-unavailable.conf;

    # Retired enterprise paths; install deploy/nginx/enterprise-retired.conf here.
    include /www/server/nginx/conf/awd-enterprise.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-aiworkdeck;
    }

    # ------------------------------------------------------------------
    # LOWA 引擎静态分发（桌面端编辑器从这里取 wasm/data）。
    # 与站点无关，形态一字未动。wasm/data 存的是 brotli 字节，
    # 必须带 Content-Encoding: br，否则桌面构建整个挂掉。
    # ------------------------------------------------------------------
    # ------------------------------------------------------------------
    # 原生资源包（native pack）静态分发。
    # 契约见桌面仓 docs/NATIVE_PACK_DISTRIBUTION.md §3.1。
    #
    # 与 /lowa-engine/ 刻意分开一个 location：那边给 wasm/data 强加
    # Content-Encoding: br，pack 走的是 tar.gz 原始字节，被加一层编码等于
    # 让客户端解出一堆乱码。所以这里 **gzip off** 且不加任何 Content-Encoding。
    #
    # manifest.json 是「最新版指针」，必须 no-cache；版本目录内容不可变，
    # 可以 immutable 长缓存。Range（断点续传）是 nginx 静态服务的默认能力，
    # 不需要额外配置——但**不能反代给 Node**，应用层整读几十 MB 进内存是 OOM。
    #
    # 北京侧走宝塔面板，配置不在本文件里：**这两段要手工同步过去**
    # （站点 www.aiworkdeck.com 的配置文件，与下面的 /api/packs/upload 一并加）。
    # ------------------------------------------------------------------
    location ^~ /plugin-packs/ {
        root /www/wwwroot;
        autoindex off;
        default_type application/octet-stream;
        gzip off;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires max;

        # 指针文件：客户端每次检查更新都要读到最新的那一份
        location ~ ^/plugin-packs/[^/]+/manifest\.json(\.sig)?$ {
            root /www/wwwroot;
            default_type application/json;
            gzip off;
            add_header Cache-Control "no-cache";
            expires -1;
            access_log off;
        }
    }

    # ------------------------------------------------------------------
    # 资源包上传（三方提交）：唯一需要放大 client_max_body_size 的路由。
    #
    # 其余路由维持 100m——上传口是整站体积上限最大的那个洞，
    # 单独开在这里，别让它顺带把所有 /api/ 都放大到 300 MB。
    # 320m 是「300 MB 受理上限 + 分片与头部余量」，与 lib/packs-store.ts 的
    # PACK_LIMITS.submissionBytes 配套；改一处要改两处。
    #
    # proxy_request_buffering off 是关键：默认 nginx 会先把整个请求体落到自己的
    # 临时文件里再转给上游，那样应用侧的流式落盘就成了摆设，磁盘还要写两遍。
    # ------------------------------------------------------------------
    location ^~ /api/packs/upload {
        client_max_body_size 320m;
        client_body_timeout 600s;
        proxy_pass http://127.0.0.1:3000;
        # 宝塔的 conf/proxy.conf 在 http 层设了 proxy_cache cache_one，所有 proxy_pass
        # 默认继承。Next 给预渲染页发的是 s-maxage=31536000，于是法律文本、公司页这类
        # 静态页会被 nginx 缓存将近一年，发版换了构建也照旧发旧的（实测过：条款页的
        # canonical 停在上一版）。缓存归 Next 自己管，这里一律关掉。北京站早已这么配。
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_request_buffering off;
        proxy_buffering off;
    }


    location ^~ /lowa-engine/ {
        root /www/wwwroot;
        autoindex off;
        default_type application/octet-stream;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        gzip off;
        location ~ ^/lowa-engine/.*\.(wasm|data)$ {
            root /www/wwwroot;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
            default_type application/octet-stream;
            expires max;
            access_log off;
        }
    }

    # ------------------------------------------------------------------
    # 内部记账口的公网兜底：`/api/internal/` 整个前缀一律 404。
    #
    # 挡的是 `app/api/internal/transfer`（dev-board#251）与
    # `app/api/internal/account`（dev-board#425）。这两条的鉴权是共享密钥
    # （`X-Internal-Secret`），**不是** Bearer awdk_；调用方只有同机部署的 Java
    # 云后端，走 127.0.0.1 直连，从不经过公网。
    #
    # 代码侧刻意不判 IP：Next 在反代后面拿到的 remote addr 恒是 nginx 自己，
    # 判它等于没判。真正的边界就是这条 404 + 共享密钥两层——account 那条口子
    # 能按手机号建号、能按 accountId 建收款单，能力面比 transfer 大，缺一层都不行。
    #
    # 必须在下面那条 `^~ /api/` 之外单列：`^~` 取最长匹配前缀，`/api/internal/`
    # 比 `/api/` 长，所以它赢。回 404 不回 403——403 等于告诉探测者
    # 「这里有东西，只是你进不去」。
    #
    # 同一条规则的国内站源本在 deploy/nginx/internal-deny.conf（那边的 vhost 在
    # 宝塔面板里，不在仓库）。核对命令见 DEPLOY.md §7.5。
    # ------------------------------------------------------------------
    location ^~ /api/internal/ { return 404; }

    # ------------------------------------------------------------------
    # 桌面端与插件的接口面。**绝不做任何 geo 301。**
    #
    # 桌面端 HttpAccountTransport 用 JDK HttpClient，默认 Redirect.NEVER 不跟随重定向；
    # 一个 301 会被 AccountService.handle 判成「预期外状态」→ MALFORMED，
    # 用户看到「官网返回了预期外的状态」，无从下手。
    # 而「注册在国际站、人在中国境内」是完全合理的场景（出差、常驻）。
    #
    # ^~ 前缀匹配优先级高于正则 location，也高于下面的 location /。
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        # 宝塔的 conf/proxy.conf 在 http 层设了 proxy_cache cache_one，所有 proxy_pass
        # 默认继承。Next 给预渲染页发的是 s-maxage=31536000，于是法律文本、公司页这类
        # 静态页会被 nginx 缓存将近一年，发版换了构建也照旧发旧的（实测过：条款页的
        # canonical 停在上一版）。缓存归 Next 自己管，这里一律关掉。北京站早已这么配。
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
        proxy_buffering off;
        # Stripe webhook 验签依赖原始报文字节，不许任何改写
        proxy_request_buffering off;
    }

    # 桌面端登录页嵌入的人机验证页（doc/desktop-contract.md「/captcha-embed 嵌入契约」）。
    # **绝不做 geo 301**：「注册在国际站、人在境内」的桌面用户在 iframe 里被 301 到国内站，
    # 拿到的是阿里云控件的 token，国际站服务端核销不了，发码必失败——而且失败得毫无提示。
    # 与 /api/ 同一条理由、同一份代理参数。
    location ^~ /captcha-embed {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /update/ {
        proxy_pass http://127.0.0.1:3000;
        # 宝塔的 conf/proxy.conf 在 http 层设了 proxy_cache cache_one，所有 proxy_pass
        # 默认继承。Next 给预渲染页发的是 s-maxage=31536000，于是法律文本、公司页这类
        # 静态页会被 nginx 缓存将近一年，发版换了构建也照旧发旧的（实测过：条款页的
        # canonical 停在上一版）。缓存归 Next 自己管，这里一律关掉。北京站早已这么配。
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ------------------------------------------------------------------
    # 账户页、法律文本与公司页同样绕开 geo 301：
    # 账户页是「我的账户在哪个站」的功能页，法律文本是缔约依据——
    # 境内访客必须能打开自己在国际站的账户与适用于他的那份条款。
    # 公司页（/{lang}/about）登载的是国际站运营主体与授权代表，
    # 支付与平台的合规核验拿它当公开来源取证，访客在哪个法域都得能打开；
    # 而它在国内站不存在（那边是另一家主体），301 过去就是 404。
    # ------------------------------------------------------------------
    # Public mobile privacy/deletion pages must keep the submitted host for every
    # visitor and reviewer. Their contact and legal entity must not change with IP.
    # Put this before the broader legal-page regex; do not special-case crawler UAs.
    location ~ ^/[a-z][a-z](-[a-z]+)?/legal/mobile-(privacy|account-deletion)/?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
    }

    location ~ ^/(zh|en)/(account|legal|about)(/|$) {
        # 美国访客照样引到 .us：那边是同一个进程、同一份账户，不存在「过去就是 404」的问题；
        # 而 .us 的公司页登载的正是美国主体，美国来的核验人员就该看那份。
        if ($awd_redirect_to_us) {
            return 301 https://www.aiworkdeck.us$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
        # 宝塔的 conf/proxy.conf 在 http 层设了 proxy_cache cache_one，所有 proxy_pass
        # 默认继承。Next 给预渲染页发的是 s-maxage=31536000，于是法律文本、公司页这类
        # 静态页会被 nginx 缓存将近一年，发版换了构建也照旧发旧的（实测过：条款页的
        # canonical 停在上一版）。缓存归 Next 自己管，这里一律关掉。北京站早已这么配。
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
    }

    # ------------------------------------------------------------------
    # 其余（营销页、广场、/start）：境内访客默认引导回国内站。
    # 这是**商业默认**不是访问控制——境内用户应当在国内站交易
    # （人民币、微信支付、发票、ICP 备案主体）。带 awd_site=intl cookie 可留下。
    #
    # 注意：这里**不再**有 rel=canonical 指向 www.aiworkdeck.com。
    # 那是「新加坡只是国内站镜像」时期的做法；现在两站是不同的缔约主体、
    # 不同币种、不同适用法，内容不再等价，canonical 会让搜索引擎把国际站整体丢弃。
    # 两站互指改用页面内的 hreflang（app/[lang]/layout.tsx 的 alternates）。
    # 同理 /_next/static 与 /_next/image 不再反代北京——本机应用自己产的资源，
    # 哈希与北京那份对不上，反代过去等于把 JS 换成另一份构建的产物。
    # ------------------------------------------------------------------
    # ------------------------------------------------------------------
    # 应用自己产的静态资源。**绝不做 geo 301。**
    #
    # 上面已经给账户页与法律文本开了绕过 301 的口子，但资源没跟着开：
    # 结果是 HTML 由本机（新加坡）产出、其中引用的 chunk 却被 301 去了北京，
    # 而两边是各自独立的构建、哈希对不上 → 404 → **React 永远不会 hydrate**。
    # 表现极阴：页面看着正常（服务端渲染的那份在），但一切客户端行为静默失效——
    # 2026-08-18 就是这样让国际站账户页的人机验证控件根本没挂上。
    #
    # 资源必须跟着引用它的那份 HTML 走，这是构建产物的完整性要求，与 geo 分流无关。
    # ------------------------------------------------------------------
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        if ($awd_redirect_to_cn) {
            return 301 https://www.aiworkdeck.com$request_uri;
        }
        if ($awd_redirect_to_us) {
            return 301 https://www.aiworkdeck.us$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
        # 宝塔的 conf/proxy.conf 在 http 层设了 proxy_cache cache_one，所有 proxy_pass
        # 默认继承。Next 给预渲染页发的是 s-maxage=31536000，于是法律文本、公司页这类
        # 静态页会被 nginx 缓存将近一年，发版换了构建也照旧发旧的（实测过：条款页的
        # canonical 停在上一版）。缓存归 Next 自己管，这里一律关掉。北京站早已这么配。
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    access_log /www/wwwlogs/workdeck.ai.log;
}
